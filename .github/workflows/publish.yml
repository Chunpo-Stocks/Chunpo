name: 股 V0.6.8 盤後更新與07:00交易計畫發布
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'public/index.html'
      - 'public/morning.js'
      - 'public/styles.css'
      - 'public/sw.js'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '本次最多回補多少日曆天（0～120，首批建議 100）'
        required: true
        default: '0'
      chip_days:
        description: '本次補回法人歷史交易日數（0～60）'
        required: true
        default: '0'
  schedule:
    # TW 15:30/17:30/21:30, Monday-Friday
    - cron: '30 7 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '30 13 * * 1-5'
    # TW 00:00 Tue-Sat (previous trading day's close)
    - cron: '0 16 * * 1-5'
    # TW 06:30 Mon-Fri catch-up, 07:00 plan publish
    - cron: '30 22 * * 0-4'
    - cron: '0 23 * * 0-4'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-v06-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 執行資料規則測試
        run: npm test
      - name: 向官方取數、更新中央歷史
        if: github.event.schedule != '0 23 * * 0-4'
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          CHIP_DAYS: ${{ github.event.inputs.chip_days || '0' }}
        run: node scripts/update.mjs --backfill-days="$BACKFILL_DAYS" --chip-days="$CHIP_DAYS"
      - name: 台北07:00 以中央歷史庫重新產生盤前推薦
        if: github.event.schedule == '0 23 * * 0-4'
        run: node scripts/build.mjs
      - name: 保存唯一歷史資料庫（不把個股細節兩千個檔案每天重複提交）
        run: |
          git config user.name 'stock-data-bot'
          git config user.email 'stock-data-bot@users.noreply.github.com'
          git add store/history.json.gz
          if ! git diff --cached --quiet; then
            git commit -m '盤後更新與歷史回補'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: 部署 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
