name: 官方行情欄位稽核（不修改歷史庫）
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v0.6.8.2-schedule-tx-rollover]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查語法與全部既有單元測試
        run: |
          node --check scripts/market-engine.mjs
          node --check scripts/update.mjs
          node --check scripts/margin-daily.mjs
          node --check public/app.js
          node --check public/morning.js
          node --check scripts/verify-integrity.mjs
          npm test
      - name: 官方欄位及日期探測（唯讀，不進行回補或覆寫）
        run: node scripts/audit-probe.mjs
      - name: 歷史庫全市場品質檢查（唯讀、不覆寫）
        run: node scripts/audit-store.mjs
  integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 只在PR沙盒執行官方全市場更新（不提交、不部署）
        run: node scripts/update.mjs --backfill-days=0 --chip-days=0
      - name: 全市場日期、資料來源、交易計畫一致性驗證
        run: |
          node scripts/verify-integrity.mjs
          node scripts/audit-store.mjs
